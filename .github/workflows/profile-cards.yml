name: Update Profile Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  generate-cards:
    name: Generate & Sync Profile Cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Generate Dot-Matrix Green Cards (streaks, about, weekly, summary)
      - name: Generate Green DotMatrix Cards
        uses: pedrocatalao/github-cool-readme@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: DATA/cool-readme.dotmatrix.yml
          output: DATA/assets/dotmatrix

      # Step 2: Generate Classic Amber Cards (fallback)
      - name: Generate Classic Amber Cards
        uses: pedrocatalao/github-cool-readme@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: DATA/cool-readme.config.yml
          output: DATA/assets/amber

      # Step 3: Align file locations and fetch dynamic data
      - name: Sync Card Assets and Refresh Dynamic Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p DATA/assets
          if [ -f "DATA/assets/dotmatrix/streaks-dark.svg" ]; then
            cp DATA/assets/dotmatrix/streaks-dark.svg DATA/assets/dotmatrix-streaks-dark.svg
          fi
          if [ -f "DATA/assets/dotmatrix/about-dark.svg" ]; then
            cp DATA/assets/dotmatrix/about-dark.svg DATA/assets/dotmatrix-about-dark.svg
          fi
          if [ -f "DATA/assets/dotmatrix/weekly-dark.svg" ]; then
            cp DATA/assets/dotmatrix/weekly-dark.svg DATA/assets/dotmatrix-weekly-dark.svg
          fi
          if [ -f "DATA/assets/dotmatrix/summary-dark.svg" ]; then
            cp DATA/assets/dotmatrix/summary-dark.svg DATA/assets/dotmatrix-summary-dark.svg
          fi
          # Recalculate and update active days to monthly (last 30 days)
          python3 scripts/update_active_days_monthly.py || true
          if [ -f "DATA/assets/amber/weekly-dark.svg" ]; then
            cp DATA/assets/amber/weekly-dark.svg DATA/assets/weekly-amber.svg
          fi
          if [ -f "DATA/assets/amber/languages-dark.svg" ]; then
            cp DATA/assets/amber/languages-dark.svg DATA/assets/classic-languages.svg
          fi
          # Update dynamic public repo count in custom tipsy top banner
          if [ -f "DATA/assets/profile-summary-details.svg" ]; then
            REPOS=$(curl -s https://api.github.com/users/vishnunandan555 | jq -r '.public_repos // empty')
            if [ -n "$REPOS" ] && [ "$REPOS" != "null" ]; then
              sed -i -E "s/>[0-9]+ public repos</>${REPOS} public repos</g" DATA/assets/profile-summary-details.svg
            fi
          fi
          # Update dynamic Markdown contributions table in README.md
          python3 scripts/update_contributions_table.py || true

      - name: Commit and push card changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DATA/assets/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(cards): update profile cards and dynamic stats [skip ci]"
            git pull --rebase origin main
            git push
          fi
