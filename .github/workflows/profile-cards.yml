name: Update Profile Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  generate-cards:
    name: Generate & Sync Profile Cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Generate Dot-Matrix Green Cards (streaks, about, weekly, summary)
      - name: Generate Green DotMatrix Cards
        uses: pedrocatalao/github-cool-readme@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: NEW/cool-readme.dotmatrix.yml
          output: NEW/assets/dotmatrix

      # Step 2: Generate Classic Amber Cards (fallback)
      - name: Generate Classic Amber Cards
        uses: pedrocatalao/github-cool-readme@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: NEW/cool-readme.config.yml
          output: NEW/assets/amber

      # Step 3: Align file locations and fetch dynamic data
      - name: Sync Card Assets and Refresh Dynamic Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p NEW/assets
          if [ -f "NEW/assets/dotmatrix/streaks-dark.svg" ]; then
            cp NEW/assets/dotmatrix/streaks-dark.svg NEW/assets/dotmatrix-streaks-dark.svg
          fi
          if [ -f "NEW/assets/dotmatrix/about-dark.svg" ]; then
            cp NEW/assets/dotmatrix/about-dark.svg NEW/assets/dotmatrix-about-dark.svg
          fi
          if [ -f "NEW/assets/dotmatrix/weekly-dark.svg" ]; then
            cp NEW/assets/dotmatrix/weekly-dark.svg NEW/assets/dotmatrix-weekly-dark.svg
          fi
          if [ -f "NEW/assets/dotmatrix/summary-dark.svg" ]; then
            cp NEW/assets/dotmatrix/summary-dark.svg NEW/assets/dotmatrix-summary-dark.svg
          fi
          if [ -f "NEW/assets/amber/weekly-dark.svg" ]; then
            cp NEW/assets/amber/weekly-dark.svg NEW/assets/weekly-amber.svg
          fi
          if [ -f "NEW/assets/amber/languages-dark.svg" ]; then
            cp NEW/assets/amber/languages-dark.svg NEW/assets/classic-languages.svg
          fi
          # Update dynamic public repo count in custom tipsy top banner
          if [ -f "NEW/assets/profile-summary-details.svg" ]; then
            REPOS=$(curl -s https://api.github.com/users/vishnunandan555 | jq -r '.public_repos // empty')
            if [ -n "$REPOS" ] && [ "$REPOS" != "null" ]; then
              sed -i -E "s/>[0-9]+ public repos</>${REPOS} public repos</g" NEW/assets/profile-summary-details.svg
            fi
          fi
          # Fetch dynamic GitHub PR Stats (Contribution Timeline)
          curl -s --max-time 20 "https://github-pr-stats-five.vercel.app/api/github-pr-stats?username=vishnunandan555&theme=dark&limit=5" -o NEW/assets/github-pr-stats.svg || true
          if [ -f "NEW/assets/github-pr-stats.svg" ]; then
            sed -i 's/style="background-color: #0d1117;"//g' NEW/assets/github-pr-stats.svg
          fi

      - name: Commit and push card changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NEW/assets/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(cards): update profile cards and dynamic stats [skip ci]"
            git pull --rebase origin main
            git push
          fi
