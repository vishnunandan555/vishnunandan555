<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330">
    <defs>
        <style>
            svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
            .title { font-size: 16px; font-weight: 400; fill: #58a6ff; }
            .subtitle { font-size: 12px; fill: #8b949e; }
            .section-label { font-size: 13px; font-weight: 500; fill: #58a6ff; }
            .bar-label { font-size: 9px; fill: #8b949e; text-anchor: middle; }
            .stat-label { font-size: 11px; fill: #8b949e; }
            .stat-val { font-size: 11px; font-weight: 600; fill: #c9d1d9; }
            .bar-fill { fill: #238636; rx: 2; ry: 2; }
            .bar-accent { fill: #2ea043; rx: 2; ry: 2; }
            .icon { fill: #58a6ff; }
            .dot { fill: #2ea043; }
        </style>
    </defs>

    <!-- Header -->
    <g transform="translate(16, 24)">
        <path class="icon" d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 01-1.484.211c-.04-.282-.163-.547-.37-.847a8.695 8.695 0 00-.542-.68c-.084-.1-.173-.205-.268-.32C3.201 7.75 2.5 6.766 2.5 5.25 2.5 2.31 4.863 0 8 0s5.5 2.31 5.5 5.25c0 1.516-.701 2.5-1.328 3.259-.095.115-.184.22-.268.319-.207.245-.383.453-.541.681-.208.3-.33.565-.37.847a.75.75 0 01-1.485-.212c.084-.593.337-1.078.621-1.489.203-.292.45-.584.673-.848.075-.088.147-.173.213-.253.561-.679.985-1.32.985-2.304 0-2.06-1.637-3.75-4-3.75zM6 15.25a.75.75 0 01.75-.75h2.5a.75.75 0 010 1.5h-2.5a.75.75 0 01-.75-.75zM5.75 12a.75.75 0 000 1.5h4.5a.75.75 0 000-1.5h-4.5z"/>
        <text x="24" y="13" class="title">Recent coding habits</text>
        <text x="180" y="13" class="subtitle">(Asia/Kolkata · IST)</text>
    </g>

    <!-- Hourly commit activity chart -->
    <g transform="translate(16, 60)">
        <text x="0" y="0" class="section-label">Commit activity per hour of day</text>
        
        <!-- Hours: 00 to 23 (24 bars, width=10, spacing=18.5) -->
        <g transform="translate(4, 14)">
            <!-- 00 --> <rect x="0" y="45" width="10" height="15" class="bar-fill" opacity="0.35"/> <text x="5" y="70" class="bar-label">00</text>
            <!-- 01 --> <rect x="18" y="52" width="10" height="8" class="bar-fill" opacity="0.2"/> <text x="23" y="70" class="bar-label">01</text>
            <!-- 02 --> <rect x="37" y="55" width="10" height="5" class="bar-fill" opacity="0.15"/> <text x="42" y="70" class="bar-label">02</text>
            <!-- 03 --> <rect x="55" y="57" width="10" height="3" class="bar-fill" opacity="0.1"/> <text x="60" y="70" class="bar-label">03</text>
            <!-- 04 --> <rect x="74" y="57" width="10" height="3" class="bar-fill" opacity="0.1"/> <text x="79" y="70" class="bar-label">04</text>
            <!-- 05 --> <rect x="92" y="56" width="10" height="4" class="bar-fill" opacity="0.15"/> <text x="97" y="70" class="bar-label">05</text>
            <!-- 06 --> <rect x="111" y="54" width="10" height="6" class="bar-fill" opacity="0.2"/> <text x="116" y="70" class="bar-label">06</text>
            <!-- 07 --> <rect x="129" y="50" width="10" height="10" class="bar-fill" opacity="0.25"/> <text x="134" y="70" class="bar-label">07</text>
            <!-- 08 --> <rect x="148" y="44" width="10" height="16" class="bar-fill" opacity="0.4"/> <text x="153" y="70" class="bar-label">08</text>
            <!-- 09 --> <rect x="166" y="36" width="10" height="24" class="bar-fill" opacity="0.55"/> <text x="171" y="70" class="bar-label">09</text>
            <!-- 10 --> <rect x="185" y="26" width="10" height="34" class="bar-fill" opacity="0.7"/> <text x="190" y="70" class="bar-label">10</text>
            <!-- 11 --> <rect x="203" y="20" width="10" height="40" class="bar-fill" opacity="0.8"/> <text x="208" y="70" class="bar-label">11</text>
            <!-- 12 --> <rect x="222" y="16" width="10" height="44" class="bar-fill" opacity="0.85"/> <text x="227" y="70" class="bar-label">12</text>
            <!-- 13 --> <rect x="240" y="22" width="10" height="38" class="bar-fill" opacity="0.75"/> <text x="245" y="70" class="bar-label">13</text>
            <!-- 14 --> <rect x="259" y="14" width="10" height="46" class="bar-fill" opacity="0.9"/> <text x="264" y="70" class="bar-label">14</text>
            <!-- 15 --> <rect x="277" y="10" width="10" height="50" class="bar-fill" opacity="0.95"/> <text x="282" y="70" class="bar-label">15</text>
            <!-- 16 --> <rect x="296" y="4" width="10" height="56" class="bar-accent" opacity="1.0"/> <text x="301" y="70" class="bar-label">16</text>
            <!-- 17 --> <rect x="314" y="8" width="10" height="52" class="bar-fill" opacity="0.95"/> <text x="319" y="70" class="bar-label">17</text>
            <!-- 18 --> <rect x="333" y="15" width="10" height="45" class="bar-fill" opacity="0.85"/> <text x="338" y="70" class="bar-label">18</text>
            <!-- 19 --> <rect x="351" y="22" width="10" height="38" class="bar-fill" opacity="0.75"/> <text x="356" y="70" class="bar-label">19</text>
            <!-- 20 --> <rect x="370" y="12" width="10" height="48" class="bar-fill" opacity="0.9"/> <text x="375" y="70" class="bar-label">20</text>
            <!-- 21 --> <rect x="388" y="18" width="10" height="42" class="bar-fill" opacity="0.8"/> <text x="393" y="70" class="bar-label">21</text>
            <!-- 22 --> <rect x="407" y="26" width="10" height="34" class="bar-fill" opacity="0.7"/> <text x="412" y="70" class="bar-label">22</text>
            <!-- 23 --> <rect x="425" y="38" width="10" height="22" class="bar-fill" opacity="0.5"/> <text x="430" y="70" class="bar-label">23</text>
        </g>
    </g>

    <!-- Days of week commit activity -->
    <g transform="translate(16, 168)">
        <text x="0" y="0" class="section-label">Commit activity per day of week</text>
        
        <g transform="translate(12, 14)">
            <!-- Mon -->
            <rect x="0" y="24" width="18" height="32" class="bar-fill" opacity="0.7"/>
            <text x="9" y="68" class="bar-label">Mon</text>
            
            <!-- Tue -->
            <rect x="65" y="32" width="18" height="24" class="bar-fill" opacity="0.55"/>
            <text x="74" y="68" class="bar-label">Tue</text>

            <!-- Wed -->
            <rect x="130" y="12" width="18" height="44" class="bar-fill" opacity="0.85"/>
            <text x="139" y="68" class="bar-label">Wed</text>

            <!-- Thu -->
            <rect x="195" y="16" width="18" height="40" class="bar-fill" opacity="0.8"/>
            <text x="204" y="68" class="bar-label">Thu</text>

            <!-- Fri -->
            <rect x="260" y="0" width="18" height="56" class="bar-accent" opacity="1.0"/>
            <text x="269" y="68" class="bar-label">Fri</text>

            <!-- Sat -->
            <rect x="325" y="8" width="18" height="48" class="bar-fill" opacity="0.9"/>
            <text x="334" y="68" class="bar-label">Sat</text>

            <!-- Sun -->
            <rect x="390" y="18" width="18" height="38" class="bar-fill" opacity="0.75"/>
            <text x="399" y="68" class="bar-label">Sun</text>
        </g>
    </g>

    <!-- Bottom Facts: Clean two-line stacked layout (Zero overlap) -->
    <g transform="translate(16, 276)">
        <!-- Line 1: Active Hours -->
        <circle cx="5" cy="5" r="3" class="dot"/>
        <text x="16" y="9" class="stat-label">Most active period: <tspan class="stat-val">Afternoon &amp; Evening (14:00 – 20:00 IST)</tspan></text>
        
        <!-- Line 2: Peak Day -->
        <circle cx="5" cy="27" r="3" class="dot"/>
        <text x="16" y="31" class="stat-label">Peak day: <tspan class="stat-val">Friday (214 commits)</tspan></text>
    </g>
</svg>