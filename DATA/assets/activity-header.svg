<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 48" width="890" height="48">
  <defs>
    <!-- Left Laser Gradient -->
    <linearGradient id="laserLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dff74" stop-opacity="0" />
      <stop offset="40%" stop-color="#3dff74" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3dff74" stop-opacity="0.9" />
    </linearGradient>

    <!-- Right Laser Gradient -->
    <linearGradient id="laserRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dff74" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#3dff74" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3dff74" stop-opacity="0" />
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="headerBadgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="laserFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .header-title {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
        fill: #f0f6fc;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Left Laser Line -->
  <line x1="90" y1="24" x2="325" y2="24" stroke="url(#laserLeft)" stroke-width="1.5" filter="url(#laserFilter)" />
  <line x1="160" y1="24" x2="325" y2="24" stroke="#3dff74" stroke-width="1" stroke-opacity="0.8" />

  <!-- Right Laser Line -->
  <line x1="565" y1="24" x2="800" y2="24" stroke="url(#laserRight)" stroke-width="1.5" filter="url(#laserFilter)" />
  <line x1="565" y1="24" x2="730" y2="24" stroke="#3dff74" stroke-width="1" stroke-opacity="0.8" />

  <!-- Center Squircle Header Badge -->
  <g>
    <!-- Outer Squircle Container -->
    <rect x="330" y="8" width="230" height="32" rx="7" fill="url(#headerBadgeGlow)" stroke="#30363d" stroke-width="1" />
    <!-- Subtle inner green border highlight -->
    <rect x="331" y="9" width="228" height="30" rx="6" fill="none" stroke="#3dff74" stroke-width="1" stroke-opacity="0.25" />

    <!-- GitHub Octicon Icon -->
    <g transform="translate(348, 16)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#3dff74">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </g>

    <!-- Header Text -->
    <text x="372" y="29" class="header-title">
      Recent Activity Board
    </text>
  </g>
</svg>
