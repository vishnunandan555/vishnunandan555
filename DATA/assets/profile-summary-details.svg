<svg xmlns="http://www.w3.org/2000/svg" width="850" height="165" viewBox="0 0 850 165" fill="none">
  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #3dff74; }
      .text-meta { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 400; fill: #c9d1d9; }
      .text-link { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #3dff74; }
      .text-axis { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #8b949e; }
      .text-axis-bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #c9d1d9; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 500; fill: #8b949e; }
      .icon { fill: #8b949e; }
      .grid-line { stroke: #30363d; stroke-width: 0.8; stroke-dasharray: 2 3; opacity: 0.7; }
    </style>
    <clipPath id="avatar-clip">
      <rect x="23" y="23" width="119" height="119" rx="10" ry="10"/>
    </clipPath>
    <linearGradient id="chart-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dff74" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3dff74" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <a href="https://vishnunandan.xyz" target="_blank" style="cursor: pointer;">
    <!-- Transparent Clickable Canvas -->
    <rect width="850" height="165" fill="none" pointer-events="all"/>

    <!-- Left Column: Avatar Photo -->
    <g>
      <image href="data:image/jpeg;base64," x="23" y="23" width="119" height="119" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)"/>
      <rect x="23" y="23" width="119" height="119" rx="10" fill="none" stroke="#3dff74" stroke-width="2"/>
    </g>

    <!-- Middle Column: Metadata -->
    <g transform="translate(160, 25)">
      <!-- Row 1: Name -->
      <g transform="translate(0, 16)">
        <path class="icon" d="M10.5 5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0ZM0 13c0-2.21 3.58-4 8-4s8 1.79 8 4v1H0v-1Z" transform="translate(0, -12) scale(0.9)"/>
        <text x="22" y="0" class="text-title">Vishnu Nandan (vishnunandan555)</text>
      </g>

      <!-- Row 2: Repos -->
      <g transform="translate(0, 42)">
        <path class="icon" d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM2 4h12v1.5H2Zm0 3.5h12V9H2Zm0 3.5h12V13H2Z" transform="translate(0, -12) scale(0.9)"/>
        <text x="22" y="0" class="text-meta">28 public repos</text>
      </g>

      <!-- Row 3: Joined -->
      <g transform="translate(0, 68)">
        <path class="icon" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0Zm7-3.25a.75.75 0 0 0-1.5 0v3.5a.75.75 0 0 0 .471.696l2.5 1a.75.75 0 0 0 .558-1.392L8.5 7.742V4.75Z" transform="translate(0, -12) scale(0.9)"/>
        <text x="22" y="0" class="text-meta">Joined GitHub 2 years ago</text>
      </g>

      <!-- Row 4: Location / Info -->
      <g transform="translate(0, 94)">
        <path class="icon" d="M8 0a5 5 0 0 0-5 5c0 3.5 5 9 5 9s5-5.5 5-9a5 5 0 0 0-5-5Zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z" transform="translate(0, -12) scale(0.9)"/>
        <text x="22" y="0" class="text-meta">Kerala, India</text>
      </g>

      <!-- Row 5: Link -->
      <g transform="translate(0, 119)">
        <path fill="#3dff74" d="M10.604 1h4.146a.25.25 0 0 1 .25.25v4.146a.25.25 0 0 1-.427.177L13.03 4.03 9.28 7.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.75-3.75-1.543-1.543A.25.25 0 0 1 10.604 1ZM3.75 2A1.75 1.75 0 0 0 2 3.75v8.5c0 .966.784 1.75 1.75 1.75h8.5A1.75 1.75 0 0 0 14 12.25v-3.5a.75.75 0 0 0-1.5 0v3.5a.25.25 0 0 1-.25.25h-8.5a.25.25 0 0 1-.25-.25v-8.5a.25.25 0 0 1 .25-.25h3.5a.75.75 0 0 0 0-1.5h-3.5Z" transform="translate(0, -12) scale(0.9)"/>
        <text x="22" y="0" class="text-link">Visit Personal Website</text>
      </g>
    </g>

    <!-- Right Column: Commits per Quarter Chart (3-Month Quarters: 2023 - 2024) -->
    <g transform="translate(440, 18)">
      <!-- Grid lines -->
      <line x1="0" y1="15" x2="355" y2="15" class="grid-line"/>
      <line x1="0" y1="45" x2="355" y2="45" class="grid-line"/>
      <line x1="0" y1="75" x2="355" y2="75" class="grid-line"/>
      <line x1="0" y1="105" x2="355" y2="105" class="grid-line"/>

      <!-- Y-Axis Commit Count Ticks -->
      <text x="365" y="19" class="text-axis-bold">300</text>
      <text x="365" y="49" class="text-axis-bold">200</text>
      <text x="365" y="79" class="text-axis-bold">100</text>
      <text x="365" y="108" class="text-axis-bold">0</text>

      <!-- Area Path -->
      <path d="M 20 85 L 65 75 L 110 92 L 155 62 L 200 78 L 245 52 L 290 68 L 335 20 L 335 105 L 20 105 Z" fill="url(#chart-area)"/>

      <!-- Line Path -->
      <path d="M 20 85 L 65 75 L 110 92 L 155 62 L 200 78 L 245 52 L 290 68 L 335 20" fill="none" stroke="#3dff74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Dots on 8 Quarters -->
      <circle cx="20" cy="85" r="3.5" fill="#3dff74" stroke="#0d1117" stroke-width="1.5"/>
      <circle cx="65" cy="75" r="3.5" fill="#3dff74" stroke="#0d1117" stroke-width="1.5"/>
      <circle cx="110" cy="92" r="3.5" fill="#3dff74" stroke="#0d1117" stroke-width="1.5"/>
      <circle cx="155" cy="62" r="3.5" fill="#3dff74" stroke="#0d1117" stroke-width="1.5"/>
      <circle cx="200" cy="78" r="3.5" fill="#3dff74" stroke="#0d1117" stroke-width="1.5"/>
      <circle cx="245" cy="52" r="3.5" fill="#3dff74" stroke="#0d1117" stroke-width="1.5"/>
      <circle cx="290" cy="68" r="3.5" fill="#3dff74" stroke="#0d1117" stroke-width="1.5"/>
      <circle cx="335" cy="20" r="3.5" fill="#3dff74" stroke="#0d1117" stroke-width="1.5"/>

      <!-- X-Axis Labels (Quarters over 2 years) -->
      <text x="20" y="119" text-anchor="middle" class="text-axis">Q1 '23</text>
      <text x="65" y="119" text-anchor="middle" class="text-axis">Q2</text>
      <text x="110" y="119" text-anchor="middle" class="text-axis">Q3</text>
      <text x="155" y="119" text-anchor="middle" class="text-axis">Q4</text>
      <text x="200" y="119" text-anchor="middle" class="text-axis">Q1 '24</text>
      <text x="245" y="119" text-anchor="middle" class="text-axis">Q2</text>
      <text x="290" y="119" text-anchor="middle" class="text-axis">Q3</text>
      <text x="335" y="119" text-anchor="middle" class="text-axis">Q4</text>

      <!-- Label -->
      <text x="355" y="134" text-anchor="end" class="text-label">Commits per quarter (3-month blocks)</text>
    </g>
  </a>
</svg>